baseURL = 'https://www.fkik.ch/'
defaultContentLanguage = 'de'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
buildFuture      = true

# Festwerte (selten ändernd) — User-editierbare Inhalte stehen in data/site.yaml
[params]
  orgName        = 'Förderverein Kirchenmusik in der Kartäuserkirche'
  orgShortName   = 'Förderverein Kirchenmusik Kartäuserkirche'
  orgAltName     = 'FKiK'
  orgFounding    = '2024'
  venueName      = 'Kartäuserkirche Basel'
  venueCity      = 'Basel'
  venueRegion    = 'BS'
  venueCountry   = 'CH'
  venuePostalCode = '4058'
  ogImage        = '/media/kantorei.png'
  ogImageWidth   = '1200'
  ogImageHeight  = '630'

[languages]
  [languages.de]
    languageName = 'Deutsch'
    weight       = 1
    title        = 'Förderverein Kirchenmusik in der Kartäuserkirche'

    [languages.de.params]
      locale         = 'de_CH'
      inLanguage     = 'de-CH'
      description    = 'Der Förderverein Kirchenmusik in der Kartäuserkirche unterstützt Kirchenmusik-Anlässe der Evangelisch-Lutherischen Kirche Basel und Nordwestschweiz – Kantatengottesdienste, Konzerte und Orgelmusik in der Kartäuserkirche.'
      ogDescription  = 'Kirchenmusik-Anlässe in der Kartäuserkirche Basel: Kantatengottesdienste, Konzerte und Orgelmusik. Werden Sie Mitglied oder unterstützen Sie uns mit einer Spende.'
      orgDescription = 'Der Förderverein Kirchenmusik in der Kartäuserkirche bezweckt die finanzielle und organisatorische Unterstützung von Kirchenmusik-Anlässen der Evangelisch-Lutherischen Kirche Basel und Nordwestschweiz in der Kartäuserkirche.'
      ogImageAlt     = 'Innenraum der Kartäuserkirche Basel mit Arp Schnitger-Orgel'
      footerDesc     = 'Wir unterstützen Kirchenmusik-Anlässe der Evangelisch-Lutherischen Kirche Basel und Nordwestschweiz in der Kartäuserkirche – Kantatengottesdienste, Konzerte und Orgelmusik.'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
