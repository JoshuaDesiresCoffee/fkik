- icon: concerts
  title: "Konzerte & Gottesdienste"
  text: "Von festlichen Kantatengottesdiensten bis zu grossen Orchesterkonzerten: Wir gestalten Musikerlebnisse, die bewegen und verbinden — in der Kartäuserkirche und darüber hinaus."
- icon: choir
  title: "Kantorei & Chor"
  text: "Die Kantorei der Kartäuserkirche ist das Herzstück unserer Arbeit. Engagierte Sängerinnen und Sänger geben der Gemeinde eine Stimme — in Gottesdienst und Konzert."
- icon: organ
  title: "Orgelmusik"
  text: "Die Orgel der Kartäuserkirche ist ein Instrument von besonderer Schönheit. Wir sorgen für ihre Pflege und ermöglichen Orgelkonzerte, die ihren Klang in den Vordergrund stellen."
