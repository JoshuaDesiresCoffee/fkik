- icon: community
  title: "Gemeinschaft & Mitglieder"
  text: "Unser Verein lebt von seinen Mitgliedern. Jährliche Versammlungen, gesellige Zusammenkünfte und die gemeinsame Leidenschaft für Musik verbinden Menschen verschiedenster Hintergründe."
- icon: arts
  title: "Künstlerische Förderung"
  text: "Wir finanzieren Konzerte, Noten und Instrumente. Wir unterstützen die Kantorei bei Proben und Aufführungen und ermöglichen jungen Musikerinnen und Musikern den Zugang zur Kirchenmusik."
- icon: church
  title: "Kirchliche Zusammenarbeit"
  text: "Wir sind Partner der Kirchgemeinde, nicht Konkurrenz. Gemeinsam mit dem Kantorat und der Kirchenleitung gestalten wir ein Programm, das Gottesdienst und Konzert als Einheit versteht."
