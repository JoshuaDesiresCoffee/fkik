- icon: community
  title: "Gemeinschaft & Mitglieder"
  text: "Unser Verein lebt von seinen Mitgliedern. Jährliche Versammlungen, gesellige Zusammenkünfte und die gemeinsame Leidenschaft für Musik verbinden Menschen verschiedenster Hintergründe."
- icon: arts
  title: "Künstlerische Förderung"
  text: "Wir finanzieren das Erarbeiten der musikalischen Programme, die Proben und die Aufführung der Musikbeiträge in den Kantatengottesdiensten. Im Zentrum steht die reiche Tradition der lutherischen Kirchenmusik, die im sonstigen Konzertbetrieb zu wenig Beachtung findet."
- icon: church
  title: "Kirchliche Anbindung"
  text: "Der Förderverein ist Partner der Evangelisch-Lutherischen Gemeinde Basel. Durch die Einheit von Gottesdienst und Konzert wird ein historisches Kulturgut gepflegt. Natürlich bereichert die professionelle Musik auch das Gemeindeleben. Doch der ursprüngliche Impuls liegt auf der Kulturgutpflege."
