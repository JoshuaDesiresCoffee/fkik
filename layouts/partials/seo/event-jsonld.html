{{- /* Expects . = an anlaesse Page */ -}}
{{- $d := partial "event-date.html" .Date -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Event",
  "name": {{ .Title | jsonify }},
  "description": {{ .Params.description | jsonify }},
  "startDate": {{ $d.datetime | jsonify }},
  "eventStatus": "https://schema.org/EventScheduled",
  "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
  "inLanguage": {{ .Site.Params.inLanguage | jsonify }},
  "isAccessibleForFree": {{ .Params.isFree | default false }},
  "url": {{ .Permalink | jsonify }},
  "image": {{ with index .Params.images 0 }}{{ .src | absURL | jsonify }}{{ else }}{{ "media/chor.jpg" | absURL | jsonify }}{{ end }},
  "location": {
    "@type": "Place",
    "name": {{ (.Site.Data.site.contact.venue_name | default .Site.Params.venueName) | jsonify }},
    "address": {
      "@type": "PostalAddress",
      "addressLocality": {{ .Site.Params.venueCity | jsonify }},
      "postalCode": {{ .Site.Params.venuePostalCode | default "4058" | jsonify }},
      "addressCountry": {{ .Site.Params.venueCountry | jsonify }}
    }
  },
  "organizer": {
    "@type": "Organization",
    "@id": {{ printf "%s#organization" .Site.BaseURL | jsonify }}
  }{{ with .Params.performers }},
  "performer": [{{ range $i, $p := . }}{{ if $i }},{{ end }}
    { "@type": "PerformingGroup", "name": {{ $p | jsonify }} }{{ end }}
  ]{{ end }}{{ if .Params.isFree }},
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "CHF"
  }{{ end }}
}
</script>
