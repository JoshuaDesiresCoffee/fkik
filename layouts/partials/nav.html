{{ $section := .Section }}
{{ if .IsHome }}{{ $section = "" }}{{ end }}

<nav class="site-nav" role="navigation" aria-label="Hauptnavigation">
  <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
  <div class="site-nav__inner">
    <a class="site-nav__home-link" href="/" aria-label="{{ i18n "breadcrumb_home" }} — {{ $.Site.Params.orgName }}">
      {{ i18n "brand_name_line1" }}
    </a>
    <ul class="site-nav__list" role="list">
      {{ range $.Site.Data.navigation.main }}
      <li class="site-nav__item">
        <a class="site-nav__link" href="{{ .url }}"{{ if eq $section .key }} aria-current="page"{{ end }}>
          {{ .name }}
        </a>
      </li>
      {{ end }}
    </ul>
    <label for="nav-toggle" class="nav-toggle-btn" role="button" aria-expanded="false" aria-label="{{ i18n "nav_toggle_open" }}">
      <svg class="nav-toggle-btn__icon nav-toggle-btn__icon--open" width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <rect x="1" y="1" width="5" height="5" rx="1"/>
        <rect x="7.5" y="1" width="5" height="5" rx="1"/>
        <rect x="14" y="1" width="5" height="5" rx="1"/>
        <rect x="1" y="7.5" width="5" height="5" rx="1"/>
        <rect x="7.5" y="7.5" width="5" height="5" rx="1"/>
        <rect x="14" y="7.5" width="5" height="5" rx="1"/>
        <rect x="1" y="14" width="5" height="5" rx="1"/>
        <rect x="7.5" y="14" width="5" height="5" rx="1"/>
        <rect x="14" y="14" width="5" height="5" rx="1"/>
      </svg>
      <svg class="nav-toggle-btn__icon nav-toggle-btn__icon--close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <line x1="5" y1="5" x2="19" y2="19"/>
        <line x1="19" y1="5" x2="5" y2="19"/>
      </svg>
    </label>
  </div>
</nav>
