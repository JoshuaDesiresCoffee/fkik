{{- /* Expects a slice of dicts: { name, url, current } */ -}}
<nav class="breadcrumb" aria-label="{{ i18n "breadcrumb_aria" }}">
  <ol class="breadcrumb__list" itemscope itemtype="https://schema.org/BreadcrumbList">
    {{ range $i, $item := . }}
    <li class="breadcrumb__item"
        itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
      {{ if $item.current }}
        <span class="breadcrumb__current" itemprop="name">{{ $item.name }}</span>
      {{ else }}
        <a href="{{ $item.url }}" class="breadcrumb__link" itemprop="item">
          <span itemprop="name">{{ $item.name }}</span>
        </a>
      {{ end }}
      <meta itemprop="position" content="{{ add $i 1 }}">
    </li>
    {{ end }}
  </ol>
</nav>
